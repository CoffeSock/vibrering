<!DOCTYPE html>
<html>
<body>
<button onclick="testVibrate()">Test</button>
<p id="out"></p>

<script>
function testVibrate() {
  document.getElementById("out").textContent =
    "Supported: " + ("vibrate" in navigator);

  if ("vibrate" in navigator) {
    const result = navigator.vibrate(500);
    document.getElementById("out").textContent +=
      "\nReturned: " + result;
  }
}
</script>
</body>
</html>
