<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phone GPS Tracker</title>

<style>
body {
    margin: 0;
    padding: 16px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

h1 {
    text-align: center;
}

button {
    width: 100%;
    min-height: 65px;
    font-size: 20px;
    margin-bottom: 12px;
    border: none;
    border-radius: 12px;
}

#startBtn {
    background: #4caf50;
    color: white;
}

#stopBtn {
    background: #f44336;
    color: white;
}

#vibrateBtn {
    background: #2196f3;
    color: white;
}

#status {
    background: white;
    padding: 16px;
    border-radius: 12px;
    font-size: 18px;
    white-space: pre-wrap;
}
</style>
</head>
<body>

<h1>GPS Tracker</h1>

<button id="startBtn" onclick="startTracking()">
Start Tracking
</button>

<button id="stopBtn" onclick="stopTracking()">
Stop Tracking
</button>

<button id="vibrateBtn" onclick="vibratePhone()">
Test Vibration
</button>

<div id="status">
Waiting...
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getFirestore,
    doc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {
    apiKey: "AIzaSyAaEwiTK79c0fMuDwvE1Oxuox-LiNpxJ6o",

  authDomain: "tracker-4cc60.firebaseapp.com",

  projectId: "tracker-4cc60",

  storageBucket: "tracker-4cc60.firebasestorage.app",

  messagingSenderId: "1057848421394",

  appId: "1:1057848421394:web:e0c94714ece72b77f2fccb",

  measurementId: "G-0TWTRSLJCG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let watchId = null;

const statusBox =
document.getElementById("status");

let deviceName =
localStorage.getItem("deviceName");

if (!deviceName) {

    deviceName = prompt(
        "Enter a device name"
    ) || "Unknown Device";

    localStorage.setItem(
        "deviceName",
        deviceName
    );
}

window.vibratePhone = function() {

    if ("vibrate" in navigator) {
        navigator.vibrate([200,100,200]);
    }
};

window.startTracking = function() {

    if (!navigator.geolocation) {

        statusBox.textContent =
            "Geolocation not supported.";

        return;
    }

    vibratePhone();

    watchId =
    navigator.geolocation.watchPosition(

        async (position) => {

            const lat =
            position.coords.latitude;

            const lng =
            position.coords.longitude;

            const accuracy =
            position.coords.accuracy;

            statusBox.textContent =
`Device: ${deviceName}

Latitude: ${lat}
Longitude: ${lng}
Accuracy: ${accuracy} m

Updated:
${new Date().toLocaleTimeString()}`;

            try {

                await setDoc(
                    doc(
                        db,
                        "tracking",
                        deviceName
                    ),
                    {
                        name: deviceName,
                        latitude: lat,
                        longitude: lng,
                        accuracy: accuracy,
                        timestamp: Date.now()
                    }
                );

            } catch(err) {

                statusBox.textContent +=
                    "\n\nFirebase Error:\n" +
                    err.message;
            }
        },

        (error) => {

            statusBox.textContent =
                "GPS Error:\n" +
                error.message;
        },

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }
    );
};

window.stopTracking = function() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

        statusBox.textContent =
            "Tracking stopped.";
    }
};

</script>

</body>
</html>
