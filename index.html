<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Tracker</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

#controls {
    padding: 10px;
}

#map {
    height: 70vh;
}

#status {
    padding: 10px;
    white-space: pre-wrap;
}
</style>
</head>
<body>

<div id="controls">
    <button onclick="startTracking()">Start Tracking</button>
    <button onclick="stopTracking()">Stop Tracking</button>
</div>

<div id="status">
Waiting...
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* ==========================
   YOUR FIREBASE CONFIG HERE
   ========================== */

const firebaseConfig = {
  apiKey: "AIzaSyAaEwiTK79c0fMuDwvE1Oxuox-LiNpxJ6o",

  authDomain: "tracker-4cc60.firebaseapp.com",

  projectId: "tracker-4cc60",

  storageBucket: "tracker-4cc60.firebasestorage.app",

  messagingSenderId: "1057848421394",

  appId: "1:1057848421394:web:e0c94714ece72b77f2fccb",

  measurementId: "G-0TWTRSLJCG"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let watchId = null;

const status = document.getElementById("status");

/* ==========================
   LEAFLET MAP
   ========================== */

const map = L.map("map").setView([0, 0], 15);

L.tileLayer(
  "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "&copy; OpenStreetMap"
  }
).addTo(map);

const marker = L.marker([0, 0]).addTo(map);

/* ==========================
   VIBRATION
   ========================== */

function vibratePhone() {
    if ("vibrate" in navigator) {
        navigator.vibrate([200, 100, 200]);
    }
}

/* ==========================
   START TRACKING
   ========================== */

window.startTracking = function() {

    if (!navigator.geolocation) {
        status.textContent =
            "Geolocation not supported.";
        return;
    }

    vibratePhone();

    watchId =
    navigator.geolocation.watchPosition(

        async (position) => {

            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;

            status.textContent =
`Latitude: ${lat}
Longitude: ${lng}
Accuracy: ${accuracy} m
Updated: ${new Date().toLocaleTimeString()}`;

            marker.setLatLng([lat, lng]);

            map.setView([lat, lng]);

            try {

                await setDoc(
                    doc(db, "tracking", "phone"),
                    {
                        latitude: lat,
                        longitude: lng,
                        accuracy: accuracy,
                        timestamp: Date.now()
                    }
                );

            } catch (err) {

                console.error(err);

                status.textContent +=
                    "\n\nFirebase Error:\n" +
                    err.message;
            }
        },

        (error) => {
            status.textContent =
                "GPS Error:\n" +
                error.message;
        },

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000
        }
    );
};

/* ==========================
   STOP TRACKING
   ========================== */

window.stopTracking = function() {

    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

        status.textContent =
            "Tracking stopped.";
    }
};

/* ==========================
   LIVE FIREBASE LISTENER
   ========================== */

onSnapshot(
    doc(db, "tracking", "phone"),
    (snapshot) => {

        const data = snapshot.data();

        if (!data) return;

        marker.setLatLng([
            data.latitude,
            data.longitude
        ]);
    }
);

</script>

</body>
</html>
