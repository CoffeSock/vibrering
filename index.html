<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Tracker</title>

<style>
body {
    margin: 0;
    padding: 16px;
    font-family: Arial;
    background: #f5f5f5;
}

button {
    width: 100%;
    min-height: 60px;
    font-size: 20px;
    margin-bottom: 12px;
    border: none;
    border-radius: 12px;
}

#startBtn { background: #4caf50; color: white; }
#stopBtn { background: #f44336; color: white; }
#vibrateBtn { background: #2196f3; color: white; }

#status {
    background: white;
    padding: 16px;
    border-radius: 12px;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>GPS Tracker</h1>

<button id="startBtn" onclick="startTracking()">Start Tracking</button>
<button id="stopBtn" onclick="stopTracking()">Stop Tracking</button>
<button id="vibrateBtn" onclick="vibratePhone()">Test Vibration</button>

<div id="status">Waiting...</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
 apiKey: "AIzaSyAaEwiTK79c0fMuDwvE1Oxuox-LiNpxJ6o",

  authDomain: "tracker-4cc60.firebaseapp.com",

  projectId: "tracker-4cc60",

  storageBucket: "tracker-4cc60.firebasestorage.app",

  messagingSenderId: "1057848421394",

  appId: "1:1057848421394:web:e0c94714ece72b77f2fccb",

  measurementId: "G-0TWTRSLJCG"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let watchId = null;
const statusBox = document.getElementById("status");

let deviceName = localStorage.getItem("deviceName");

if (!deviceName) {
  deviceName = prompt("Enter device name") || "Unknown";
  localStorage.setItem("deviceName", deviceName);
}

/* VIBRATION */
window.vibratePhone = function () {
  if ("vibrate" in navigator) {
    navigator.vibrate([200, 100, 200]);
  }
};

/* START */
window.startTracking = async function () {

  vibratePhone();

  if (!navigator.geolocation) {
    statusBox.textContent = "Geolocation not supported.";
    return;
  }

  /* FORCE ONLINE IMMEDIATELY */
  await setDoc(doc(db, "tracking", deviceName), {
    name: deviceName,
    status: "active",
    timestamp: Date.now()
  });

  watchId = navigator.geolocation.watchPosition(
    async (pos) => {

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      statusBox.textContent =
`Device: ${deviceName}

Latitude: ${lat}
Longitude: ${lng}
Accuracy: ${acc} m

Status: ACTIVE`;

      await setDoc(doc(db, "tracking", deviceName), {
        name: deviceName,
        latitude: lat,
        longitude: lng,
        accuracy: acc,
        status: "active",
        timestamp: Date.now()
      });
    },

    async (error) => {

      statusBox.textContent = "GPS ERROR: " + error.message;

      await setDoc(doc(db, "tracking", deviceName), {
        name: deviceName,
        status: "error",
        timestamp: Date.now(),
        lastError: error.message
      });
    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 10000
    }
  );
};

/* STOP */
window.stopTracking = async function () {

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  statusBox.textContent = "Tracking STOPPED";

  await setDoc(doc(db, "tracking", deviceName), {
    name: deviceName,
    status: "stopped",
    timestamp: Date.now()
  });
};

</script>

</body>
</html>
